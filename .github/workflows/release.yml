name: macOS release

on:
  push:
    tags:
      - 'v0.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v0.x.x tag to validate or release
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect tag and any existing release
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source-version.outputs.commit }}
      already_released: ${{ steps.release.outputs.already_released }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve and check out the requested tag
        id: source
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Expected a v0.x.x release tag, got: %s\n' "$REQUESTED_TAG" >&2
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source version and record tag commit
        id: source-version
        run: |
          set -euo pipefail
          VERSION='${{ steps.source.outputs.version }}'
          python3 -I - "$VERSION" Cargo.toml native/AppInfo.plist <<'PY'
          import plistlib
          import re
          import sys
          expected, manifest_path, plist_path = sys.argv[1:]
          manifest = open(manifest_path, encoding="utf-8").read()
          package = re.search(r"(?ms)^\[package\]\s*\n(.*?)(?=^\[|\Z)", manifest)
          version = re.search(r'^version\s*=\s*"(0\.\d+\.\d+)"\s*$', package[1], re.M) if package else None
          if not version or version[1] != expected:
              raise SystemExit(f"Cargo.toml package version must match tag {expected}.")
          with open(plist_path, "rb") as source:
              info = plistlib.load(source)
          for key in ("CFBundleShortVersionString", "CFBundleVersion"):
              if info.get(key) != expected:
                  raise SystemExit(f"native/AppInfo.plist {key} must match tag {expected}.")
          if not info.get("SUPublicEDKey") or not info.get("SUFeedURL"):
              raise SystemExit("native/AppInfo.plist must configure SUPublicEDKey and SUFeedURL.")
          PY
          COMMIT="$(git rev-parse 'HEAD^{commit}')"
          if [[ "$(git rev-parse "${{ steps.source.outputs.tag }}^{commit}")" != "$COMMIT" ]]; then
            printf '%s\n' 'Checked out commit does not match the requested tag.' >&2
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Verify an already-published release or confirm it is absent
        id: release
        run: |
          set -euo pipefail
          TAG='${{ steps.source.outputs.tag }}'
          VERSION='${{ steps.source.outputs.version }}'
          RESPONSE="$RUNNER_TEMP/release.json"
          ERROR="$RUNNER_TEMP/release-error.txt"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RESPONSE" 2> "$ERROR"; then
            python3 -I - "$RESPONSE" "$VERSION" <<'PY'
          import json
          import pathlib
          import sys
          release = json.loads(pathlib.Path(sys.argv[1]).read_text())
          version = sys.argv[2]
          required = {f"FourQuadrants-GPUI-{version}-arm64.zip", "appcast.xml", "SHA256SUMS"}
          actual = {asset["name"] for asset in release.get("assets", [])}
          if release.get("draft") or release.get("prerelease"):
              raise SystemExit("A draft or prerelease already uses this tag; refusing to replace it.")
          if release.get("tag_name") != "v" + version or actual != required:
              raise SystemExit("A release already uses this tag but does not have exactly the expected three assets; refusing to overwrite it.")
          PY
            DOWNLOAD="$RUNNER_TEMP/existing-release"
            mkdir -m 700 "$DOWNLOAD"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$DOWNLOAD"
            ARCHIVE="$DOWNLOAD/FourQuadrants-GPUI-$VERSION-arm64.zip"
            (cd "$DOWNLOAD" && shasum -a 256 -c SHA256SUMS)
            PUBLIC_KEY="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' native/AppInfo.plist)"
            SIGNATURE="$(python3 -I - "$DOWNLOAD/appcast.xml" "$ARCHIVE" "$VERSION" "$TAG" "$GITHUB_REPOSITORY" native/AppInfo.plist <<'PY'
          import pathlib
          import plistlib
          import sys
          import xml.etree.ElementTree as ET
          appcast_path, archive_path, version, tag, repo, plist_path = sys.argv[1:]
          with open(plist_path, "rb") as source:
              info = plistlib.load(source)
          root = ET.parse(appcast_path).getroot()
          channel = root.find("channel")
          item = channel.find("item") if channel is not None else None
          enclosure = item.find("enclosure") if item is not None else None
          ns = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          archive = pathlib.Path(archive_path)
          expected_url = f"https://github.com/{repo}/releases/download/{tag}/{archive.name}"
          required = {
              "feed URL": (channel.findtext("link") if channel is not None else None, info.get("SUFeedURL")),
              "archive URL": (enclosure.get("url") if enclosure is not None else None, expected_url),
              "archive length": (enclosure.get("length") if enclosure is not None else None, str(archive.stat().st_size)),
              "version": (item.findtext(f"{{{ns}}}version") if item is not None else None, version),
              "short version": (item.findtext(f"{{{ns}}}shortVersionString") if item is not None else None, version),
              "minimum macOS": (item.findtext(f"{{{ns}}}minimumSystemVersion") if item is not None else None, info.get("LSMinimumSystemVersion")),
              "architecture": (item.findtext(f"{{{ns}}}hardwareRequirements") if item is not None else None, "arm64"),
              "OS": (enclosure.get(f"{{{ns}}}os") if enclosure is not None else None, "macos"),
          }
          for name, (actual, expected) in required.items():
              if actual != expected:
                  raise SystemExit(f"Existing appcast {name} mismatch: {actual!r} != {expected!r}")
          signature = enclosure.get(f"{{{ns}}}edSignature")
          if not signature:
              raise SystemExit("Existing appcast has no Sparkle EdDSA signature.")
          print(signature)
          PY
          )"
            xcrun swift scripts/update-key.swift verify "$ARCHIVE" "$SIGNATURE" "$PUBLIC_KEY"
            echo 'already_released=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' "Verified existing release $TAG; skipping build and upload."
          else
            if ! grep -q 'HTTP 404' "$ERROR"; then
              printf '%s\n' 'Could not check GitHub release state:' >&2
              /bin/cat "$ERROR" >&2
              exit 1
            fi
            echo 'already_released=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Validate and package arm64 release
    needs: inspect
    if: needs.inspect.outputs.already_released != 'true'
    runs-on: macos-15
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.inspect.outputs.commit }}
          persist-credentials: false
      - name: Check signing setup and runner architecture
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set +x
          set -euo pipefail
          test "$(uname -m)" = arm64
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            printf '%s\n' 'Configure repository secret SPARKLE_PRIVATE_KEY before publishing a new version.' >&2
            exit 1
          fi
      - name: Install stable Rust and pinned project components
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version --verbose
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-macos-arm64-${{ hashFiles('Cargo.lock') }}
      - name: Validate Rust, native helper, updater, and signing code
        run: |
          set -euo pipefail
          cargo fmt --check --manifest-path Cargo.toml
          cargo test --locked --manifest-path Cargo.toml
          cargo clippy --locked --all-targets --manifest-path Cargo.toml
          bash scripts/build-native.sh
          target/native/four-quadrants-helper self-test
          bash scripts/test-updater.sh
          swift scripts/update-key.swift self-test
      - name: Build signed app bundle
        run: bash scripts/bundle.sh release
      - name: Sign and verify the release archive
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            printf '%s\n' 'Repository secret SPARKLE_PRIVATE_KEY must contain the base64 Ed25519 seed.' >&2
            exit 1
          fi
          bash scripts/package-release.sh "https://github.com/$GITHUB_REPOSITORY/releases/download/${{ needs.inspect.outputs.tag }}" --skip-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.inspect.outputs.version }}
          path: dist/releases/${{ needs.inspect.outputs.version }}/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified release assets
    needs: [inspect, build]
    if: needs.inspect.outputs.already_released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.inspect.outputs.version }}
          path: release-assets
      - name: Publish without replacing existing assets
        env:
          TAG: ${{ needs.inspect.outputs.tag }}
          VERSION: ${{ needs.inspect.outputs.version }}
          TAG_COMMIT: ${{ needs.inspect.outputs.commit }}
        run: |
          set -euo pipefail
          ARCHIVE="release-assets/FourQuadrants-GPUI-$VERSION-arm64.zip"
          test -f "$ARCHIVE"
          test -f release-assets/appcast.xml
          test -f release-assets/SHA256SUMS
          (cd release-assets && shasum -a 256 -c SHA256SUMS)
          gh release create "$TAG" \
            "$ARCHIVE" \
            release-assets/appcast.xml \
            release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$TAG_COMMIT" \
            --title "FourQuadrants GPUI $VERSION" \
            --notes "Apple Silicon release for macOS 14 and later."
